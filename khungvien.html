<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Rectangles</title>
        <style>
            .outside{
                border: 6px dotted blue;
                border-radius: 15px;
                padding: 20px;
                width: 300px;
            }
            .middle{
                border: 3px dashed red;
                border-radius: 15px;
                padding: 20px;
            }
            .inner{
                border: 2px solid green;
                    border-radius: 4px;
                padding: 25px;
                text-align: center;
                font-size: 24px;
            }
            .inner p{
                font-size: 24px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="outside">
            <div class="middle">
                <div class="inner">
                    I am heavily packed <br>
                    <p>&lt;DIV&gt;</p>
                </div>
            </div>
        </div>
    </body>
</html>
